<script>
var API_URL='https://script.google.com/macros/s/AKfycbyP33EHRM0MwiPPmxaNjJmryw5romM5XWGMmujSLfXWTQDjhPesNYeqrCoidBEmgXR4/exec';
var G=function(a,p){return new Promise(function(ok,no){var pl=JSON.stringify({action:a,params:p||{}});fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:pl}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(d){ok(d)}).catch(function(e){fetch(API_URL+'?action='+encodeURIComponent(a)+'&params='+encodeURIComponent(pl)).then(function(r2){return r2.json()}).then(function(d2){ok(d2)}).catch(function(e2){no(e2.toString())})})})};
/* Konversi ID file Drive menjadi URL yang bisa ditampilkan di <img> */
/* 3 level fallback untuk menampilkan gambar:
   1. Jika sudah berupa URL lengkap → pakai langsung
   2. Jika berupa file ID → pakai proxy doGet
   3. Jika proxy gagal → onerror di <img> coba thumbnail Drive */
function imgUrl(id){
  if(!id) return '';
  /* Sudah URL lengkap (setSharing berhasil sebelumnya) */
  if(id.indexOf('http')===0) return id;
  /* File ID → gunakan proxy doGet */
  return API_URL + '?action=getimage&id=' + encodeURIComponent(id);
}
var _tkI=null;function stTkR(u){spTkR();_tkI=setInterval(function(){if(!document.getElementById('tkd')){spTkR();return}DH.rfTk(u)},30000)}function spTkR(){if(_tkI){clearInterval(_tkI);_tkI=null}}

/* ============================================================
   UPLOAD GAMBAR KE GOOGLE DRIVE (bukan base64 di cell)
   ============================================================ */
function upImg(targetId){
  var inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.style.position='fixed';inp.style.left='-9999px';
  document.body.appendChild(inp);
  inp.onchange=function(){
    var f=inp.files[0];
    if(!f){document.body.removeChild(inp);return}
    if(f.size>2000000){toast('Maks 2MB','warning');document.body.removeChild(inp);return}
    var reader=new FileReader();
    reader.onload=function(e){
      var img=new Image();
      img.onload=function(){
        /* Kompres gambar agar payload tidak terlalu besar */
        var canvas=document.createElement('canvas');
        var w=img.width,h=img.height,maxW=800,maxH=600;
        if(w>maxW){h=h*maxW/w;w=maxW}
        if(h>maxH){w=w*maxH/h;h=maxH}
        canvas.width=Math.max(1,Math.round(w));
        canvas.height=Math.max(1,Math.round(h));
        var ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        var dataUrl=canvas.toDataURL('image/jpeg',0.75);
        var base64=dataUrl.split(',')[1];
        toast('Mengupload gambar...','warning');
        G('uploadImage',{data:base64,mimeType:'image/jpeg',ext:'jpg'}).then(function(r){
          if(!r.s){toast(r.error,'error');document.body.removeChild(inp);return}
          var url=r.d.url;
          var hidden=document.getElementById(targetId+'_gambar');
          if(hidden)hidden.value=url;
          var prev=document.getElementById(targetId+'_preview');
          if(prev){prev.innerHTML=_imgPrevHTML(url,targetId);prev.style.display=''}
          toast('Gambar berhasil diupload');
          document.body.removeChild(inp);
        }).catch(function(err){toast(err,'error');document.body.removeChild(inp)});
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(f);
  };
  inp.click();
}
function _imgPrevHTML(id,targetId){
  var src1 = esc(imgUrl(id));
  var src2 = 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w200';
  return '<div class="img-preview-box"><img src="'+src1+'" onerror="this.onerror=null;this.src=\''+src2+'\';" onerror="this.style.display=\'none\'"><span class="img-del" onclick="clearImg(\''+escJ(targetId)+'\')">&times;</span></div>';
}
function clearImg(targetId){
  var h=document.getElementById(targetId+'_gambar');
  var p=document.getElementById(targetId+'_preview');
  if(h)h.value='';
  if(p){p.innerHTML='';p.style.display='none'}
}

function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function escJ(s){if(s===null||s===undefined)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

/* ============================================================
   RENDER TEKS + GAMBAR SOAL (cell terpisah)
   ============================================================ */
function rT(t,img){
  if(!t&&!img) return '';
  var html='';
  if(t){
    var im=[];
    var p=t.replace(/\[IMG:(.*?)\]/g,function(m,u){var i=im.length;im.push(u);return'%%'+i+'%%'});
    p=esc(p);
    for(var i=0;i<im.length;i++) p=p.replace('%%'+i+'%%','<img src="'+esc(imgUrl(im[i]))+'" class="max-w-full max-h-80 rounded-lg my-2" onerror="this.style.display=\'none\'">');
    html+=p;
  }
  if(img){
    var src1=esc(imgUrl(img));
    var src2='https://drive.google.com/thumbnail?id='+encodeURIComponent(img)+'&sz=w1200';
    html+='<div class="my-3"><img src="'+src1+'" onerror="this.onerror=null;this.src=\''+src2+'\';" class="max-w-full max-h-96 rounded-lg" onerror="this.style.display=\'none\'"></div>';
  }
  return html;
}

/* ============================================================
   RENDER OPSI + GAMBAR OPSI (cell terpisah)
   ============================================================ */
function rO(t,img){
  if(!t&&!img) return '';
  var html='';
  if(t){
    if(t.match(/\[IMG:/)){
      html+=t.replace(/\[IMG:(.*?)\]/g,function(m,u){
        return '<img src="'+esc(imgUrl(u))+'" class="max-h-20 rounded inline-block mx-1 align-middle" onerror="this.style.display=\'none\'">';
      });
    }else{
      html+=esc(t);
    }
  }
  if(img){
    var src1=esc(imgUrl(img));
    var src2='https://drive.google.com/thumbnail?id='+encodeURIComponent(img)+'&sz=w600';
    html+='<img src="'+src1+'" onerror="this.onerror=null;this.src=\''+src2+'\';" class="max-h-20 rounded inline-block mx-1 align-middle" onerror="this.style.display=\'none\'">';
  }
  return html;
}

function toast(m,t){var c={success:'text-green-400',error:'text-red-400',warning:'text-yellow-400'};var d=document.createElement('div');d.className='fixed bottom-6 left-1/2 -translate-x-1/2 z-[200] gs px-6 py-3 rounded-xl text-sm font-medium asu';d.innerHTML='<span class="'+(c[t||'success']||c.success)+'">'+esc(m)+'</span>';document.body.appendChild(d);setTimeout(function(){d.style.opacity='0';d.style.transition='opacity .3s';setTimeout(function(){d.remove()},300)},3000)}

/* ============================================================
   PREVIEW SOAL - MENAMPILKAN GAMBAR DARI CELL TERPISAH
   ============================================================ */
/* State filter preview */
_pvData:[],_pvMap:{},_pvExam:'',_pvType:'',

preview:function(){
  var ct=document.getElementById('dc');
  document.getElementById('ds').textContent='Preview semua soal dari spreadsheet';
  ct.innerHTML=ldH();
  Promise.all([G('getAllSoal'),G('getUjian',{role:U.role,userId:U.id,kelas:U.kelas})]).then(function(res){
    var allSoal=res[0].d||[],allUjian=res[1].d||[];
    var ujianMap={};
    allUjian.forEach(function(u){ujianMap[u.id]=u.nama});

    /* Hitung soal per ujian */
    var examCnt={};
    allSoal.forEach(function(q){examCnt[q.ujian_id]=(examCnt[q.ujian_id]||0)+1});

    /* Dropdown ujian */
    var opts='<option value="">Semua Ujian ('+allSoal.length+')</option>';
    allUjian.forEach(function(u){
      var c=examCnt[u.id]||0;
      if(c>0) opts+='<option value="'+u.id+'">'+esc(u.nama)+' ('+c+')</option>';
    });

    /* Hitung per tipe */
    var types={pg:0,bs:0,short:0,essay:0,menjodohkan:0,menyusun:0};
    allSoal.forEach(function(q){if(types[q.jenis]!==undefined)types[q.jenis]++});
    var tl={pg:'Pilihan Ganda',bs:'Benar/Salah',short:'Isian',essay:'Essay',menjodohkan:'Menjodohkan',menyusun:'Menyusun'};

    var h='<div class="mb-6 space-y-3">';
    h+='<div class="flex flex-wrap items-center gap-3"><label class="text-xs text-gray-400 font-semibold shrink-0">Ujian:</label>';
    h+='<select id="pv_exam" onchange="DH._pvCh()" class="bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-purple-500 flex-1 max-w-md">'+opts+'</select></div>';
    h+='<div class="flex flex-wrap gap-2" id="pv_tbtns">';
    h+='<button onclick="DH._pvST(\'\',this)" class="pvf on px-4 py-2 rounded-xl text-xs font-semibold transition">Semua ('+allSoal.length+')</button>';
    for(var t in tl) h+='<button onclick="DH._pvST(\''+t+'\',this)" class="pvf px-4 py-2 rounded-xl text-xs font-semibold transition">'+tl[t]+' ('+types[t]+')</button>';
    h+='</div></div><div id="pvc"></div>';

    ct.innerHTML=h;
    DH._pvData=allSoal;DH._pvMap=ujianMap;DH._pvExam='';DH._pvType='';
    DH._pvRender();ic();
  }).catch(function(e){ct.innerHTML='<p class="text-red-400">'+esc(e)+'</p>';ic()});
},

/* Ganti filter tipe */
_pvST:function(jns,btn){
  DH._pvType=jns;
  document.querySelectorAll('#pv_tbtns .pvf').forEach(function(b){b.classList.remove('on')});
  if(btn)btn.classList.add('on');
  DH._pvRender();
},

/* Ganti filter ujian dari dropdown */
_pvCh:function(){
  DH._pvExam=document.getElementById('pv_exam').value;
  DH._pvRender();
},

/* Render soal sesuai filter aktif */
_pvRender:function(){
  var all=DH._pvData||[],filtered=all;
  if(DH._pvExam) filtered=filtered.filter(function(q){return q.ujian_id===DH._pvExam});
  if(DH._pvType) filtered=filtered.filter(function(q){return q.jenis===DH._pvType});

  /* Update angka pada tombol tipe (sesuai filter ujian saat ini) */
  var base=DH._pvExam?all.filter(function(q){return q.ujian_id===DH._pvExam}):all;
  var types={pg:0,bs:0,short:0,essay:0,menjodohkan:0,menyusun:0};
  base.forEach(function(q){if(types[q.jenis]!==undefined)types[q.jenis]++});
  var tS={pg:'PG',bs:'B/S',short:'Isian',essay:'Essay',menjodohkan:'Jodoh',menyusun:'Susun'};
  var btns=document.querySelectorAll('#pv_tbtns .pvf');
  if(btns.length){
    btns[0].textContent='Semua ('+base.length+')';
    var ti=0;for(var t in tS){ti++;if(btns[ti])btns[ti].textContent=tS[t]+' ('+types[t]+')';}
  }

  var ct=document.getElementById('pvc');
  if(!filtered.length){ct.innerHTML='<div class="gs rounded-xl p-8 text-center text-gray-400">Tidak ada soal</div>';ic();return}

  var tl={pg:'PG',bs:'B/S',short:'Isian',essay:'Essay',menjodohkan:'Jodoh',menyusun:'Susun'};
  var cl={pg:'bg-blue-500/20 text-blue-400',bs:'bg-green-500/20 text-green-400',short:'bg-cyan-500/20 text-cyan-400',essay:'bg-purple-500/20 text-purple-400',menjodohkan:'bg-yellow-500/20 text-yellow-400',menyusun:'bg-pink-500/20 text-pink-400'};
  var h='<div class="space-y-4">';

/* MENJODOHKAN */
EX._rM=function(q){if(!EX.mS[q.id])EX.mS[q.id]={p:[]};var st=EX.mS[q.id],L=(q.opsi_a||'').split('|').filter(Boolean),R=(q.opsi_b||'').split('|').filter(Boolean),cBdr=['#3b82f6','#22c55e','#eab308','#ec4899','#06b6d4','#f97316'],cBg=['rgba(59,130,246,.12)','rgba(34,197,94,.12)','rgba(234,179,8,.12)','rgba(236,72,153,.12)','rgba(6,182,212,.12)','rgba(249,115,22,.12)'],usedR={};st.p.forEach(function(pr){usedR[pr.r]=true});var availOpts=[];R.forEach(function(txt,idx){if(!usedR[idx])availOpts.push({idx:idx,txt:txt})});var h='<p class="text-xs text-gray-400 mb-4">Pilih pasangan menggunakan dropdown:</p><div class="space-y-2">';L.forEach(function(lTxt,lIdx){var pair=null,pairNum=-1;for(var pi=0;pi<st.p.length;pi++){if(st.p[pi].l===lIdx){pair=st.p[pi];pairNum=pi;break}}if(pair!==null){var ci=pairNum%cBdr.length;h+='<div class="mj-row"><div class="mj-left mj-paired" style="border-color:'+cBdr[ci]+';background:'+cBg[ci]+'">'+esc(lTxt)+'</div><svg class="mj-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg><div class="mj-paired-text" style="background:'+cBg[ci]+';border:2px solid '+cBdr[ci]+';border-radius:12px;color:rgba(255,255,255,.85)">'+esc(R[pair.r]||'')+'</div><button onclick="EX.mUn(\''+q.id+'\','+lIdx+')" class="mj-unbtn" title="Putuskan"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>'}else{h+='<div class="mj-row"><div class="mj-left">'+esc(lTxt)+'</div><svg class="mj-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';if(availOpts.length>0){h+='<select onchange="EX.mSel(\''+q.id+'\','+lIdx+',this.value)" class="mj-dd"><option value="">-- Pilih --</option>';availOpts.forEach(function(opt){h+='<option value="'+opt.idx+'">'+esc(opt.txt)+'</option>'});h+='</select>'}else{h+='<div class="mj-dd" style="opacity:.4;cursor:not-allowed;text-align:center;font-size:12px">Terpakai</div>'}h+='<div style="width:32px;flex-shrink:0"></div></div>'}});h+='</div><div class="mj-ref"><p class="text-xs text-gray-500 font-semibold mb-1">Kolom Kanan:</p>';R.forEach(function(txt,idx){h+='<span class="mj-ref-item'+(usedR[idx]?' mj-ref-used':'')+'">'+esc(txt)+'</span>'});h+='</div>';return h};
EX.mSel=function(qid,lIdx,rIdxStr){if(rIdxStr==='')return;EX.mS[qid].p.push({l:lIdx,r:parseInt(rIdxStr)});EX._saveM(qid)};
EX.mUn=function(qid,lIdx){var st=EX.mS[qid];for(var i=0;i<st.p.length;i++){if(st.p[i].l===lIdx){st.p.splice(i,1);break}}EX._saveM(qid)};
EX._saveM=function(qid){var st=EX.mS[qid];EX.answers[qid]=st.p.map(function(p){return p.l+','+p.r}).join('|');EX.rn();var b=document.getElementById('mb_'+qid);if(b)b.innerHTML=EX._rM(EX.soal.find(function(x){return x.id===qid}));ic()};

EX._rO=function(q){if(!EX.oS[q.id])EX.oS[q.id]=[];var items=(q.opsi_a||'').split('|').filter(Boolean),seq=EX.oS[q.id],used={};seq.forEach(function(idx){used[idx]=true});var h='<p class="text-xs text-gray-400 mb-3">Klik kata sesuai urutan:</p><div class="flex flex-wrap gap-2 mb-4">';items.forEach(function(t,idx){h+='<button onclick="EX.oA(\''+q.id+'\','+idx+')" class="oc px-4 py-2 rounded-xl text-sm border-2 '+(used[idx]?'used border-white/5 bg-white/5 text-gray-600':'border-white/10 bg-white/5 text-white hover:border-purple-500/50')+'">'+esc(t)+'</button>'});h+='</div><p class="text-xs text-gray-500 mb-2 font-semibold">Urutan Anda:</p>';if(!seq.length)h+='<div class="border-2 border-dashed border-white/10 rounded-xl p-4 text-center text-sm text-gray-500">Klik kata di atas</div>';else{h+='<div class="space-y-2">';seq.forEach(function(idx,pos){h+='<div class="flex items-center gap-2"><span class="w-6 h-6 rounded-full bg-purple-500 text-white text-xs flex items-center justify-center font-bold shrink-0">'+(pos+1)+'</span><span class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-2 text-sm">'+esc(items[idx]||'')+'</span><button onclick="EX.oR(\''+q.id+'\','+pos+')" class="text-red-400 hover:text-red-300 p-1"><i data-lucide="x" class="w-4 h-4"></i></button></div>'});h+='</div>'}return h};
